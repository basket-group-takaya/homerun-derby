<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the canvas run under the notch; the safe-area
     insets below tell the HUD where not to put anything important. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="color-scheme" content="dark">
<meta name="description" content="BASKET HOME RUN DERBY — 縦画面のホームラン競争">
<title>BASKET HOME RUN DERBY</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon/icon-192.png">

<!-- iOS standalone: no Safari chrome once added to the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HR DERBY">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;

    /* 100dvh, not 100%.
       With position:fixed;inset:0 the body takes the LARGE viewport — the size
       the page would be with the browser's toolbars hidden — so its bottom sits
       underneath the URL bar. dvh is the viewport as it is right now, toolbars
       included, and it shrinks and grows as they slide. The 100% is the
       fallback for engines that do not know dvh; JS sizes the canvas from
       visualViewport either way, so this is belt and braces. */
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #05080f;
    color: #dfe6f2;
    font: 14px/1.5 "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;

    /* An app, not a document: no scrolling, no rubber banding, no pinch zoom,
       no long-press callout, no double-tap magnifier, no blue tap flash. */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }

  /* The canvas is the whole app. Logical size is set in JS; CSS just makes it
     fill the window at whatever the device's real aspect ratio is. */
  /* Size and centring are set from JS (letterboxed fit), not from CSS. */
  #game {
    display: block;
    background: #05080f;
    touch-action: none;
  }

  /* Probe element: reading env() back out of a custom property is unreliable
     across engines, but reading a real computed padding is not. */
  #safe {
    position: fixed;
    top: 0; left: 0;
    width: 0; height: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
    visibility: hidden;
  }

  /* Landscape is not supported: the whole composition is built for portrait.
     Rather than squash it, ask for the phone to be turned. */
  #rotate {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #05080f;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  #rotate .glyph { font-size: 54px; animation: tip 2.4s ease-in-out infinite; }
  #rotate p { margin: 0; color: #9fb2cc; font-size: 15px; }
  #rotate b { color: #ffd76a; display: block; font-size: 19px; margin-bottom: 6px; }
  @keyframes tip {
    0%, 40%, 100% { transform: rotate(0deg); }
    60%, 90% { transform: rotate(-90deg); }
  }

  /* Only shown in a desktop browser, where the phone framing needs explaining. */
  #hint {
    position: fixed;
    left: 50%;
    top: 4px;
    transform: translateX(-50%);
    margin: 0;
    color: #55627a;
    font-size: 12px;
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }

  @media (orientation: landscape) and (max-height: 560px) {
    #rotate { display: flex; }
  }

  /* Boot failure card. Hidden until something actually goes wrong. */
  #boot {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 28px 22px;
    background: #0b1018;
    z-index: 20;
    overflow: auto;
  }
  #boot h2 { margin: 0; font-size: 20px; color: #ff9a9a; }
  #boot p { margin: 0; font-size: 14px; color: #d6e2f2; white-space: pre-wrap; }
  #boot .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #boot button {
    font: inherit; font-size: 15px; padding: 12px 18px; border-radius: 10px;
    border: 1px solid #3a4a66; background: #1b2740; color: #e6eefb;
  }
  #boot pre {
    margin: 0; font-size: 11.5px; line-height: 1.45; color: #7f90a8;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
  <div id="safe"></div>
  <canvas id="game"></canvas>

  <div id="rotate">
    <div class="glyph">📱</div>
    <p><b>縦向きにしてください</b>この試合は縦画面専用です</p>
  </div>

  <p id="hint">タップ／スペース：スイング ／ 1 2 3：選手 ／ R：やり直し ／ M：消音</p>

  <!-- Boot diagnostics. A phone that fails to start used to show a black
       rectangle and nothing else, which is impossible to report and impossible
       to debug remotely. Anything thrown before or during boot lands here. -->
  <div id="boot">
    <h2>起動できませんでした</h2>
    <p id="bootwhy"></p>
    <div class="row">
      <button id="bootreset" type="button">キャッシュを消して再読込</button>
    </div>
    <pre id="bootenv"></pre>
  </div>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      var why = document.getElementById('bootwhy');
      var env = document.getElementById('bootenv');
      var shown = false;

      function fail(what, detail) {
        if (shown) return;
        shown = true;
        why.textContent = what + (detail ? '\n' + detail : '');
        env.textContent = [
          'UA: ' + navigator.userAgent,
          'size: ' + window.innerWidth + ' x ' + window.innerHeight
            + '  dpr ' + (window.devicePixelRatio || 1),
          'url: ' + location.href,
          'sw: ' + (navigator.serviceWorker
            ? (navigator.serviceWorker.controller ? 'controlling' : 'registered/none')
            : 'unsupported'),
          'storage: ' + (function () {
            try { window.localStorage.getItem('x'); return 'ok'; }
            catch (e) { return 'BLOCKED (' + e.name + ')'; }
          })(),
        ].join('\n');
        boot.style.display = 'flex';
      }
      window.__bootFail = fail;

      window.addEventListener('error', function (e) {
        // A failed <script type=module> fires an error event with no message.
        if (e.target && e.target.tagName === 'SCRIPT') {
          fail('スクリプトを読み込めませんでした。', String(e.target.src || ''));
          return;
        }
        fail(String((e.error && e.error.message) || e.message || 'unknown error'),
          e.error && e.error.stack ? String(e.error.stack).split('\n').slice(0, 4).join('\n') : '');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        // fullscreen and orientation.lock reject harmlessly; do not shout
        // Only genuine boot failures should raise the card. Screen-orientation
        // and fullscreen requests reject routinely and mean nothing.
        var msg = String((r && (r.message || r.name)) || r || '');
        if (/fullscreen|orientation|permission|not granted|NotAllowed|AbortError|denied/i.test(msg)) return;
        fail(String((r && r.message) || r || 'unhandled rejection'));
      });

      // Boot watchdog: main.js sets window.__hrdBooted once the loop is running.
      window.setTimeout(function () {
        if (!window.__hrdBooted) {
          fail('30秒たっても起動しませんでした。'
            + 'ファイルが揃っていないか、キャッシュが壊れている可能性があります。');
        }
      }, 30000);

      document.getElementById('bootreset').addEventListener('click', function () {
        var done = function () { location.replace(location.pathname + '?nosw=1'); };
        var jobs = [];
        if (window.caches) {
          jobs.push(caches.keys().then(function (k) {
            return Promise.all(k.map(function (n) { return caches.delete(n); }));
          }));
        }
        if (navigator.serviceWorker) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(jobs).then(done, done);
      });

      // Desktop gets the key hints; a phone does not need them.
      if (!('ontouchstart' in window) && window.innerWidth > 720) {
        var hint = document.getElementById('hint');
        if (hint) hint.style.display = 'block';
      }

      // Registering the worker is what makes the game installable and
      // offline-capable. ?nosw=1 skips it, which is the escape hatch when a
      // stale worker is the thing keeping the game broken.
      if ('serviceWorker' in navigator && location.search.indexOf('nosw') < 0) {
        window.addEventListener('load', function () {
          // updateViaCache:'none' stops the browser from serving sw.js itself out
          // of the HTTP cache, which is how a worker gets stuck for a whole day.
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(function (reg) { reg.update(); })
            .catch(function () { /* plain http dev server */ });
        });
      }
    })();
  </script>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
