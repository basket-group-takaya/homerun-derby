<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>BASKET HOME RUN DERBY — スプライト検証 (M0)</title>
<style>
  :root { --ink:#1a1d24; --sub:#7c8698; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 28px 60px;
    background: #12141a; color: #e8ecf4;
    font: 14px/1.6 "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: .02em; }
  h2 { font-size: 15px; margin: 34px 0 10px; color: #b9c4d6;
       border-bottom: 1px solid #262b36; padding-bottom: 6px; }
  .lead { color: var(--sub); margin: 0 0 8px; font-size: 13px; }
  .controls { display: flex; gap: 18px; align-items: center; margin: 14px 0 4px;
              padding: 10px 14px; background: #181c25; border-radius: 8px; flex-wrap: wrap; }
  label { display: flex; gap: 7px; align-items: center; color: #c8d2e2; font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .grid.faces { grid-template-columns: repeat(8, 1fr); }
  .cell { background: #181c25; border: 1px solid #262b36; border-radius: 8px;
          overflow: hidden; display: flex; flex-direction: column; }
  .cap { font-size: 11px; color: var(--sub); padding: 5px 7px; letter-spacing: .03em;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box { position: relative; height: 240px; display: flex;
         align-items: flex-end; justify-content: center; }
  /* checkerboard so any hole in the alpha is obvious */
  .box.check {
    background-image:
      linear-gradient(45deg, #8d8d8d 25%, transparent 25%, transparent 75%, #8d8d8d 75%),
      linear-gradient(45deg, #8d8d8d 25%, #c9c9c9 25%, #c9c9c9 75%, #8d8d8d 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  .box.dark  { background: #20242e; }
  .box.light { background: #f2f4f8; }
  .box.field { background: linear-gradient(#5b86c4 0%, #7fa8d8 46%, #4c7c3a 46%, #3f6b30 100%); }
  .box img { max-width: 100%; max-height: 100%; object-fit: contain;
             image-rendering: auto; display: block; }
  .anchor { position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px;
            border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 0 2px #fff;
            display: none; }
  .show-anchor .anchor { display: block; }
  .faces .box { height: 190px; align-items: center; }
  .note { color: var(--sub); font-size: 12.5px; margin: 8px 0 0; }
  code { background: #20242e; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<h1>スプライト検証 — M0</h1>
<p class="lead">
  <code>tools/extract_sprites.py</code> の出力を目視確認する。PROMPT.md §3-7 の確認項目:
  人物の取り違え（勇樹＝眼鏡なし黒髪／貴也＝眼鏡／敦司＝茶髪）・見切れ・余白の混入・隣のコマの写り込み・
  <strong>背景が抜けているか</strong>・<strong>白いパンツが削れていないか</strong>・スイング5コマの順序。
</p>

<div class="controls">
  <label><input type="radio" name="bg" value="check" checked> 市松（透過の抜けを見る）</label>
  <label><input type="radio" name="bg" value="dark"> 暗色</label>
  <label><input type="radio" name="bg" value="light"> 明色（白パンツの欠けを見る）</label>
  <label><input type="radio" name="bg" value="field"> 球場想定</label>
  <label><input type="checkbox" id="anchors"> 接地基準点を表示</label>
</div>

<div id="players"></div>

<h2>顔素材 24枚</h2>
<p class="lead">カットイン用。プレイ中の打者には使わない（全身素材があるため）。</p>
<div id="faces"></div>

<script type="module">
const IDS = [
  ['yuki',    '籠田 勇樹 / YUKI 3 — 眼鏡なし・黒髪'],
  ['takaya',  '籠田 貴也 / TAKAYA 1 — 眼鏡'],
  ['atsushi', '安藤 敦司 / ATSUSHI 7 — 茶髪'],
];
const POSES = [
  ['stance',  '構え'],
  ['swing_0', 'スイング0 始動'],
  ['swing_1', 'スイング1 テイクバック'],
  ['swing_2', 'スイング2 インパクト'],
  ['swing_3', 'スイング3 フォロー'],
  ['swing_4', 'スイング4 フォロースルー'],
  ['back',    '背面'],
];
const VARIANTS = ['bust', 'front', 'angle', 'profile', 'smile', 'serious', 'relief', 'thinking'];

const anchors = await fetch('../assets/player/anchors.json').then(r => r.json()).catch(() => ({}));

const players = document.getElementById('players');
for (const [id, label] of IDS) {
  const h = document.createElement('h2');
  h.textContent = label;
  players.append(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const [pose, jp] of POSES) {
    const cell = document.createElement('div');
    cell.className = 'cell';

    const box = document.createElement('div');
    box.className = 'box check';

    const img = document.createElement('img');
    img.src = `../assets/player/${id}/${pose}.png`;
    img.alt = `${id} ${pose}`;
    box.append(img);

    const dot = document.createElement('div');
    dot.className = 'anchor';
    box.append(dot);
    img.addEventListener('load', () => {
      const a = anchors[`${id}/${pose}`];
      if (!a) return;
      const s = Math.min(box.clientWidth / img.naturalWidth, box.clientHeight / img.naturalHeight);
      const w = img.naturalWidth * s, hgt = img.naturalHeight * s;
      dot.style.left = `${(box.clientWidth - w) / 2 + a[0] * s}px`;
      dot.style.top = `${box.clientHeight - hgt + a[1] * s}px`;
    });

    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = jp;

    cell.append(box, cap);
    grid.append(cell);
  }
  players.append(grid);
}

const faces = document.getElementById('faces');
for (const [id, label] of IDS) {
  const h = document.createElement('div');
  h.className = 'note';
  h.textContent = label;
  faces.append(h);

  const grid = document.createElement('div');
  grid.className = 'grid faces';
  for (const v of VARIANTS) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const box = document.createElement('div');
    box.className = 'box check';
    const img = document.createElement('img');
    img.src = `../assets/face/${id}_${v}.png`;
    img.alt = `${id} ${v}`;
    box.append(img);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = v;
    cell.append(box, cap);
    grid.append(cell);
  }
  faces.append(grid);
}

for (const r of document.querySelectorAll('input[name=bg]')) {
  r.addEventListener('change', () => {
    for (const b of document.querySelectorAll('.box')) {
      b.classList.remove('check', 'dark', 'light', 'field');
      b.classList.add(r.value);
    }
  });
}
document.getElementById('anchors').addEventListener('change', (e) => {
  document.body.classList.toggle('show-anchor', e.target.checked);
});
</script>
</body>
</html>
